name: ARCSTUDIO91 Daily AI Content Seed

on:
  schedule:
    # 02:37 UTC = 08:07 Asia/Kolkata. Offset away from the top of the hour.
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcstudio91-daily-content
  cancel-in-progress: false

jobs:
  create-concept-seed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-devanagari fonts-dejavu-core fontconfig
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select today's original architecture concept
        run: python scripts/create_daily_concept.py

      - name: Commit concept freshness history
        run: |
          git config user.name "ARCSTUDIO91 Daily Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/concept_history.json output/current/concept.json output/current/cloud_source_manifest.json output/current/package_manifest.json
          git commit -m "ARCSTUDIO91 daily concept seed $(date -u +%F)" || echo "Concept seed is unchanged"
          git push origin HEAD:main

      - name: Upload concept seed for local open-weight AI generation
        uses: actions/upload-artifact@v4
        with:
          name: ARCSTUDIO91-Cloud-Source-Pack
          path: |
            output/current/concept.json
            output/current/cloud_source_manifest.json
            output/current/package_manifest.json
          if-no-files-found: error
          retention-days: 30
